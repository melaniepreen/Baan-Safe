    role: wash_food_shelter_minimums
    jurisdiction: intl
    loaded_from: policies/sphere.yaml
    verification:
      status: verified
      source_url: https://spherestandards.org/wp-content/uploads/Sphere-Handbook-2018-EN.pdf
      retrieved: "2026-10-24"
      note: Same loaded file as Thailand. Do not fork the handbook text.

  - id: ifrc-pgi-2018
