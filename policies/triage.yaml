  - id: CBD-ONLINE-MEDICAL-DIRECTION
    status: verified
    topic: safeguarding
    checks: [safeguarding, triage]
    text_en: >
      The case study says advanced procedures such as endotracheal
      intubation, cardioversion, and intravenous drug administration are
      performed via online medical direction, with EMS personnel speaking to
      the EMS medical director for specific instructions. Those procedures
      are a human medical decision. The model does not give that instruction.
    text_th: ""
    source_url: *kkh_url
    source_excerpt: >
      Advanced procedures such as endotracheal intubation, cardioversion, and
      intravenous drug administration are performed via online medical
      directions, in which EMS personnel directly communicate with the EMS MD
      to receive specific instructions.
    retrieved: *triage_date
    license_note: *kkh_license
    locator: "Khon Kaen Hospital EMS ebook, EMS medical director passage."
    caveat: "One centre's description of medical direction."

