  - id: FLOOD-TRAPPED-DISPATCH
    status: verified
    topic: triage
    checks: [triage, safeguarding]
    text_en: >
      The B.E. 2554 announcement does not map a person trapped by floodwater
      to a 1669 colour, a minute target, or a priority above a welfare
      request. Its red level is the clinical definition quoted here: a
      sudden injury or illness that threatens life unless breathing,
      circulation, or the nervous system receives immediate medical care.
      Clause 5 says that level receives emergency care immediately. Clauses
      1 to 8 do not mention floodwater, a trapped person, or a boat.
      Consciousness and breathing remain the retrieved medical signals.
      International pages about being trapped are in flood.yaml. They are
      not a 1669 colour.
    text_th: "ผู้ป่วยฉุกเฉินวิกฤต ได้แก่ บุคคลซึ่งได้รับบาดเจ็บหรือมีอาการป่วยกะทันหันซึ่งมีภาวะคุกคามต่อชีวิต ซึ่งหากไม่ได้รับปฏิบัติการแพทย์ทันทีเพื่อแก้ไขระบบการหายใจ ระบบไหลเวียนเลือด หรือระบบประสาทแล้ว ผู้ป่วยจะมีโอกาสเสียชีวิตได้สูง ให้ใช้สัญลักษณ์ “สีแดง” สำหรับผู้ป่วยฉุกเฉินวิกฤต จัดให้ผู้ป่วยฉุกเฉินวิกฤตตามข้อ ๔ (๑) ได้รับการปฏิบัติการฉุกเฉินทันที"
    source_url: *gazette_url
    source_excerpt: "ผู้ป่วยฉุกเฉินวิกฤต ได้แก่ บุคคลซึ่งได้รับบาดเจ็บหรือมีอาการป่วยกะทันหันซึ่งมีภาวะคุกคามต่อชีวิต ซึ่งหากไม่ได้รับปฏิบัติการแพทย์ทันทีเพื่อแก้ไขระบบการหายใจ ระบบไหลเวียนเลือด หรือระบบประสาทแล้ว ผู้ป่วยจะมีโอกาสเสียชีวิตได้สูง ให้ใช้สัญลักษณ์ “สีแดง” สำหรับผู้ป่วยฉุกเฉินวิกฤต"
    retrieved: *triage_date
    license_note: *gazette_license
    locator: "Royal Gazette, volume 128, special part 131 ง, pages 34-35, clauses 4 and 5. Silence on floodwater is the point of this rule."
