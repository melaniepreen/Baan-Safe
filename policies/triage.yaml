# cites the กพฉ announcement. The announcement text is the Royal Gazette
# PDF cited below. The phone-triage prose is from a Khon Kaen Hospital
# case study of criteria-based dispatch. International flood-safety rules
# are in flood.yaml. This file does not assign a 1669 colour to floodwater.

