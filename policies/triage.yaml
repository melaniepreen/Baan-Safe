  - id: NIEMS-ANNOUNCEMENT-2554
    status: verified
    topic: triage
    checks: [triage]
    text_en: >
      The Royal Gazette PDF is the ประกาศคณะกรรมการการแพทย์ฉุกเฉิน of
      B.E. 2554 on emergency-level assessment and emergency-operation
      standards. Clause 4 names five levels. The critical level is a person
      with a sudden injury or illness that threatens life, who has a high
      chance of dying if they do not receive immediate medical care for
      breathing, circulation, or the nervous system. Its symbol is red.
      The urgent level's symbol is yellow. The non-severe level's symbol
      is green. A general patient uses white. Another public-health user
      uses black. Clause 5 says the critical level receives emergency care
      immediately, and the urgent level is handled after the critical level,
      with advanced care โดยเร็ว. Clauses 1 to 8 do not print a minute
      target, a water depth, or a boat rule. The running header says
      คัดแยกระดับความฉุกเฉิน. Clause 1, as extracted, says คัดแยกผู้ป่วยฉุกเฉิน.
      That difference is left as extracted. Damaged words in the gazette
      extract are not repaired and are not quoted.
    text_th: "ผู้ป่วยฉุกเฉินวิกฤต ได้แก่ บุคคลซึ่งได้รับบาดเจ็บหรือมีอาการป่วยกะทันหันซึ่งมีภาวะคุกคามต่อชีวิต ซึ่งหากไม่ได้รับปฏิบัติการแพทย์ทันทีเพื่อแก้ไขระบบการหายใจ ระบบไหลเวียนเลือด หรือระบบประสาทแล้ว ผู้ป่วยจะมีโอกาสเสียชีวิตได้สูง ให้ใช้สัญลักษณ์ “สีแดง” สำหรับผู้ป่วยฉุกเฉินวิกฤต จัดให้ผู้ป่วยฉุกเฉินวิกฤตตามข้อ ๔ (๑) ได้รับการปฏิบัติการฉุกเฉินทันที ผู้ป่วยฉุกเฉินเร่งด่วน ได้แก่ บุคคลที่ได้รับบาดเจ็บหรือมีอาการป่วยซึ่งมีภาวะเฉียบพลันมากหรือเจ็บปวดรุนแรงอันจำเป็นต้องได้รับปฏิบัติการแพทย์อย่างรีบด่วน ให้ใช้สัญลักษณ์ “สีเหลือง” สำหรับผู้ป่วยฉุกเฉินเร่งด่วน จัดให้ผู้ป่วยฉุกเฉินเร่งด่วนตามข้อ ๔ (๒) ได้รับการปฏิบัติการฉุกเฉินถัดจากผู้ป่วยฉุกเฉินวิกฤตตามข้อ ๔ (๑) และจัดให้ได้รับปฏิบัติการแพทย์ขั้นสูงโดยเร็ว ผู้ป่วยฉุกเฉินไม่รุนแรง ได้แก่ บุคคลซึ่งได้รับบาดเจ็บหรือมีอาการป่วยซึ่งมีภาวะเฉียบพลันไม่รุนแรง ให้ใช้สัญลักษณ์ “สีขาว” สำหรับผู้ป่วยทั่วไป ให้ใช้สัญลักษณ์ “สีดำ” สำหรับผู้รับบริการสาธารณสุขอื่น"
    source_url: *gazette_url
    source_excerpt: "ผู้ป่วยฉุกเฉินวิกฤต ได้แก่ บุคคลซึ่งได้รับบาดเจ็บหรือมีอาการป่วยกะทันหันซึ่งมีภาวะคุกคามต่อชีวิต ซึ่งหากไม่ได้รับปฏิบัติการแพทย์ทันทีเพื่อแก้ไขระบบการหายใจ ระบบไหลเวียนเลือด หรือระบบประสาทแล้ว ผู้ป่วยจะมีโอกาสเสียชีวิตได้สูง ให้ใช้สัญลักษณ์ “สีแดง” สำหรับผู้ป่วยฉุกเฉินวิกฤต จัดให้ผู้ป่วยฉุกเฉินวิกฤตตามข้อ ๔ (๑) ได้รับการปฏิบัติการฉุกเฉินทันที"
    retrieved: *triage_date
    license_note: *gazette_license
    locator: "Royal Gazette, volume 128, special part 131 ง, pages 32-35, clauses 4 and 5. 4 November B.E. 2554."
    caveat: >
      A plain download of the gazette URL returned HTTP 403. The text was
      read from that URL on 24 October 2026. Words the extract damaged,
      including the clause after "เสียชีวิตได้สูง" and the green symbol
      line, are not quoted.

  - id: CBD-FIVE-CODES
    status: verified
    topic: triage
    checks: [triage]
    text_en: >
      A Khon Kaen Hospital case study of phone triage says the criteria-based
      dispatch protocol puts calls in five groups: Red, Yellow, Green, White,
      and Black. Red through Green require EMS. White does not: medical
      advice and or a suggestion to go to hospital on their own is given.
      Black is a false or prank call, meaning there is no patient, and the
      call is terminated. Green is described as mild, semi-urgent. Yellow is
      intermediate severity, urgent. Red is the highest severity, emergency.
      This is that centre's description. Minute targets in its table did not
      extract as a stable sentence and are not in this rule.
    text_th: ""
    source_url: *kkh_url
    source_excerpt: >
      According to the CBD protocol, the emergency calls are categorized
      (phone triage) into five groups: Red, Yellow, Green, White, and Black
      codes. The Red to Green codes are considered to require EMS but the
      White code is not; the Black code is false or prank calls (i.e., there
      is no patient). For the White code, medical advice and/or suggestion to
      go to hospital on their own is given. For the Black code, the calls are
      just terminated. For the Green codes, which are mild cases
      (semi-urgent). For the Yellow code cases with intermediate severity
      (urgent). For the Red code cases with the highest severity (emergency).
    retrieved: *triage_date
    license_note: *kkh_license
    locator: "Khon Kaen Hospital EMS ebook, phone-triage section. Response-time table cells were not used."
    caveat: >
      One hospital's description of the protocol, not the กพฉ announcement.

  - id: CBD-STEP1-CONSCIOUS-BREATHING
    status: verified
    topic: triage
    checks: [triage]
    text_en: >
      The same case study says the first questions, applied to all cases,
      cover the symptom, where the patient is, the caller's telephone number,
      the caller's name, whether the patient is conscious or awake, whether
      the patient is breathing normally, and age and gender. Consciousness
      and breathing are asked to identify critical cases such as cardiac
      arrest. The study does not say to store the telephone number. This
      corpus does not store one.
    text_th: ""
    source_url: *kkh_url
    source_excerpt: >
      Then important vital signs (consciousness and breathing) are asked to
      promptly identify critical cases such as cardiac arrest. 1 What's the
      patient's symptom? 2 Where is/are the patients? 5 Is the patient
      conscious / Awake? 6 Is the patient breathing normally (or not
      breathing)? 7 What is the patient's age and gender?
    retrieved: *triage_date
    license_note: *kkh_license
    locator: "Khon Kaen Hospital EMS ebook, Table 2. Questions 3 and 4 ask for a callback number and a name and are intentionally not copied into the rule text as data to collect."
    caveat: >
      One hospital's question list. Questions 3 and 4, which ask for a
      telephone number and a name, are omitted here so the corpus does not
      become a collection script for those identifiers.

