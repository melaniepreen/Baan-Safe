# Emergency triage. The five colour names are from a 2013 NIEM slide that
# cites the กพฉ announcement. The phone-triage prose is from a Khon Kaen
# Hospital case study of criteria-based dispatch. Flood water depth and a
# trapped-person colour are not in either document.

license_niem: &niem_license >
  Slides hosted by NSTDA, "National Institute for Emergency Medicine (NIEM)
  Thailand's Disaster Emergency Medical System", retrieved 24 October 2026.
  No licence line was extracted from the slides. Short quotation for this
  research corpus. Confirm before redistribution. The slides describe the
  กพฉ announcement. They are not that announcement.
  https://www.nstda.or.th/nac/2013/download/presentation/Set4/NT-106-02/04Pairoj.pdf

license_kkh: &kkh_license >
  Khon Kaen Hospital EMS ebook, retrieved 24 October 2026. No licence line
  was extracted. The chapter describes one centre's phone triage using the
  criteria-based dispatch protocol and says a computer program to assist
  triage was under development by NIEM. It is not a retrieved national
  regulation. Short quotation for this research corpus. Confirm before
  redistribution.
  https://www.kkh.go.th/wp-content/uploads/2023/09/EMS-KKH-2023_eBook-2.pdf

niem: &niem_url https://www.nstda.or.th/nac/2013/download/presentation/Set4/NT-106-02/04Pairoj.pdf
