  https://assets.publishing.service.gov.uk/media/5faa9ca5e90e0730666d4162/frco-november-2019a.pdf
  https://www.gov.uk/government/publications/flood-rescue-concept-of-operations-2019

license_gap: &gap_license >
  No further boat order was adopted, so there is no licence in a ranking.
  The withdrawal page is cited to show that the 2019 document is not
  current. ReliefWeb and DDPM were not used.

