      standing water can be dangerous for small children. Do not allow
      children to play in floodwater areas, and do not allow them to play
      with toys that floodwater has contaminated and that have not been
      disinfected. A child in floodwater is a safeguarding matter for a
      person. The page does not state an age cutoff.
