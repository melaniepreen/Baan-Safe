# International flood-safety rules. Thai 1669 colours stay in triage.yaml.
# Each figure is the number printed on that rule's own page. The pages do
# not agree on the depth that carries a vehicle, so no single vehicle depth
# is chosen. None of these pages is a 1669 colour or a baht amount.

license_nws: &nws_license >
  US National Weather Service, "During a Flood", retrieved 24 October 2026.
  US government material. Short quotation for this research corpus.
  https://www.weather.gov/safety/flood-during

license_ready_flood: &ready_flood_license >
  FEMA Ready.gov, "Floods", retrieved 24 October 2026.
  US government material. Short quotation for this research corpus.
  https://www.ready.gov/floods

license_ready_dis: &ready_dis_license >
  FEMA Ready.gov, "People with Disabilities", last updated 9 September 2026,
  retrieved 24 October 2026. US government material. Short quotation.
  The line about not leaving a person alone is in the Alzheimer's section
  of that page. It is not a flood-only age rule and it is not a score.
  https://www.ready.gov/disability

license_cdc_flood: &cdc_flood_license >
  US Centers for Disease Control and Prevention, "Safety Guidelines:
  Floodwater", updated 24 August 2026, retrieved 24 October 2026.
