  - id: MOF-2569-NO-DUPLICATE
    status: verified
    topic: denial
    checks: [denial]
    text_en: >
      Clause 6 says agencies, local government, private parties, and
      charities must coordinate so that assistance reaches people and is not
      duplicated. A second payment for the same assistance is outside this
      sentence. The clause does not define a matching procedure.
    text_th: >
      ให้มีการประสานงานกันเพื่อให้การช่วยเหลือทั่วถึงไม่ซ้ำซ้อนกัน
    source_url: *mof_url
    source_excerpt: >
      ๖. การให้ความช่วยเหลือข้างต้น ให้มีการประสานงานกันระหว่างส่วนราชการ หน่วยงานอื่นของรัฐ องค์กรปกครองส่วนท้องถิ่น เอกชน และองค์กรการกุศลที่เกี่ยวข้อง เพื่อให้การช่วยเหลือทั่วถึงไม่ซ้ำซ้อนกัน
    retrieved: *mof_date
