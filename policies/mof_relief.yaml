  - id: MOF-2569-TOILET-RATIO
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility]
    text_en: >
      Clause 5.1.9 (3) says toilets provided by a government agency at a
      temporary shelter are 1 place per 10 people. The baht figure on that
      line is not stable and is not part of this rule.
    text_th: "จัดสร้างหรือจัดหาห้องน้ำ ห้องส้วม ๑ ที่ ต่อ ๑๐ คน"
    source_url: *mof_url
    source_excerpt: "๕.๑.๙ (๓) จัดสร้างหรือจัดหาห้องนํ้า ห้องส้วม ๑ ที่ ต่อ ๑๐ คน"
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.9 (3), page 2. Baht glyphs on the next line are excluded."

