  - id: MOF-2569-CASH-DISCRETION
    status: verified
    topic: denial
    checks: [denial, aid_eligibility]
    text_en: >
      Clause 5.7 says that where an item is not specified to be paid in
      money, the authority who approves assistance may decide to pay money,
      considering the situation. That decision is the approver's discretion.
      It is not a decision for the model, and it states no amount.
    text_th: >
      หากรายการใดมิได้กำหนดให้จ่ายเป็นเงิน ให้อยู่ในดุลยพินิจของผู้มีอำนาจอนุมัติให้การช่วยเหลือ
    source_url: *mof_url
    source_excerpt: >
      ๕.๗ กรณีมีความจำเป็น หากรายการใดมิได้กำหนดให้จ่ายเป็นเงิน ให้อยู่ในดุลยพินิจของผู้มีอำนาจอนุมัติให้การช่วยเหลือพิจารณาให้จ่ายเป็นเงินก็ได้ โดยคำนึงถึงสภาพและเหตุการณ์ตามความเหมาะสม
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.7, page 8."

  - id: MOF-2569-OUTSIDE-APPROVAL
    status: verified
    topic: denial
    checks: [denial]
    text_en: >
      Clause 9 says that where assistance is needed outside these criteria
      and methods, approval must be sought from the Ministry of Finance.
      A payment that these clauses do not cover is not approved by this
      sentence. It has to be taken to the Ministry.
    text_th: >
      กรณีที่มีความจำเป็นต้องให้ความช่วยเหลือนอกเหนือจากหลักเกณฑ์นี้ ให้ขออนุมัติต่อกระทรวงการคลัง
    source_url: *mof_url
    source_excerpt: >
