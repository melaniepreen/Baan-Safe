  - id: MOF-2569-CLOTHING
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.10 caps clothing that is damaged and cannot be used again,
      or that is needed because the person has none during the disaster, at
      not more than 1,300 baht per person. The figure is a ceiling.
    text_th: "ค่าเครื่องนุ่งห่ม คนละไม่เกิน ๑,๓๐๐ บาท"
    source_url: *mof_url
    source_excerpt: >
