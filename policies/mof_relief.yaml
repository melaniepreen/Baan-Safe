  - id: MOF-2569-CROP-CAP
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      For crops that die or are damaged, assistance follows the actual
      damaged farm area and is not more than 30 rai per household, using
      average production cost. Labour is assisted at 30 percent of the
      labour cost for both short-lived crops and fruit or perennial trees.
      Fruit or perennial trees that are stunted, or whose yield is damaged,
      but that are not dead and can recover, are assisted at not more than
      30 rai per household and at 40 percent of the fruit-tree rate. The two
      limbs together are not more than 30 rai per household. Debris that a
      government agency cannot clear is assisted for not more than 5 rai.
      No baht-per-rai price is printed. Do not invent one.
    text_th: >
      ไม่เกินครัวเรือนละ ๓๐ ไร่ ค่าแรงร้อยละ ๓๐ ของค่าแรง ไม้ผลที่ชะงักร้อยละ ๔๐ ของอัตราไม้ผล และเศษวัสดุทับถมไม่เกิน ๕ ไร่
    source_url: *mof_url
    source_excerpt: >
      ตามจำนวนพื้นที่ทำการเกษตรจริงที่ได้รับความเสียหาย ทั้งนี้ ไม่เกินครัวเรือนละ ๓๐ ไร่
      รายการค่าแรงให้ช่วยเหลือในอัตราร้อยละ ๓๐ ของค่าแรง
