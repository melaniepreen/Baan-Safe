rules:
  - id: MOF-2569-INSTRUMENT
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility]
    text_en: >
      The instrument's own name, in clause 1, is the criteria, methods and
      conditions for spending the government advance to assist emergency
      disaster victims, B.E. 2569. Clause 3 says it replaces the B.E. 2563
      criteria announced on 5 October B.E. 2563. It is issued under clause 27
      of the Ministry of Finance regulation B.E. 2568. The regulation's title
      line in this PDF did not extract as a clean sentence, so this rule does
      not restate that title.
    text_th: >
      หลักเกณฑ์ วิธีการ เงื่อนไข การใช้จ่ายเงินทดรองราชการเพื่อช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน พ.ศ. ๒๕๖๙
    source_url: *mof_url
    source_excerpt: >
      ๑. หลักเกณฑ์นี้เรียกว่า "หลักเกณฑ์ วิธีการ เงื่อนไข การใช้จ่ายเงินทดรองราชการเพื่อช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน พ.ศ. ๒๕๖๙"
      อาศัยอำนาจตามความในข้อ ๒๗ แห่งระเบียบกระทรวงการคลัง พ.ศ. ๒๕๖๘
      ๓. ให้ยกเลิกหลักเกณฑ์การใช้จ่ายเงินทดรองราชการเพื่อช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน พ.ศ. ๒๕๖๓ ประกาศ ณ วันที่ ๕ ตุลาคม พ.ศ. ๒๕๖๓
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clauses 1 and 3, and the empowering line, page 1 of the DOAE PDF."

  - id: MOF-2569-EFFECTIVE
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 2 prints the date 6 March B.E. 2569 as the date
      from which the criteria apply to a disaster. Vowel marks on the verbs
      in that line are damaged in the text layer. Do not treat a retyped
      sentence as more certain than the excerpt. A disaster date before that
      printed date is not decided by this rule.
    text_th: "ตั้งแต่วันที่ ๖ มีนาคม ๒๕๖๙ เป็นต้นไป"
    source_url: *mof_url
    source_excerpt: "๒. หลักเกณฑ์นื๋ให่ใช้บังคับวันที,เกิดภัย ตั้งแต่วันที่ ๖ มีนาคม ๒๕๖๙ เป็นด้นไป"
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 2, page 1. The excerpt keeps the damaged vowels."
    caveat: >
      The date numerals are clear. The verbs around them are not a clean text layer.

  - id: MOF-2569-WITHIN-REGULATION
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 4 says advance spending must be assistance to emergency disaster
      victims within the meaning of the Ministry of Finance regulation. This
      criteria PDF does not itself contain that definition. Do not add a
      definition of flood or of who counts as a victim from another edition.
    text_th: >
      ขอบเขตการจ่ายเงินทดรองราชการจะต้องเป็นการช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉินตามความหมายแห่งระเบียบกระทรวงการคลัง
    source_url: *mof_url
    source_excerpt: >
      ๔. ขอบเขต การจ่ายเงินทดรองราชการ จะต้องเป็นการช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน ตามความหมายแห่งระเบียบกระทรวงการคลัง ว่าด้วยเงินทดรองราชการเพื่อช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 4, page 1."

  - id: MOF-2568-REGULATION-TEXT
    status: unverified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      TODO_HUMAN. The B.E. 2568 regulation's own text was not retrieved from
      a host other than DDPM. Do not copy a definition of disaster, flood
      (อุทกภัย), victim, or "this is not full compensation" from the repealed
      B.E. 2556 regulation or from memory. Eligibility and denial on those
      points stay unverified.
    text_th: ""
    source_url: *mof_url
    source_excerpt: >
      The 2569 criteria cite the 2568 regulation at clause 27 and clause 4.
      The regulation PDF itself was not retrieved for this corpus.
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Gap. Not a quotation of the 2568 regulation."

  - id: MOF-2569-CHANNEL
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility]
    text_en: >
      Clause 5 says the advance may be paid in cash, by cheque, or through
      the electronic payment system (e-Payment) under government rules, and
      that the rates and conditions below then apply. It does not name a
      bank product and it does not authorise collecting an account number.
    text_th: "ให้จ่ายเป็นเงินสด หรือเช็ค หรือจ่ายผ่านระบบอิเล็กทรอนิกส์ (e-Payment) ตามระเบียบของทางราชการ"
    source_url: *mof_url
    source_excerpt: >
      ๕. การจ่ายเงินทดรองราชการเพื่อช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน ให้จ่ายเป็นเงินสด หรือเช็ค หรือจ่ายผ่านระบบอิเล็กทรอนิกส์ (e-Payment) ตามระเบียบของทางราชการ
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5, page 1."

  - id: MOF-2569-FOOD
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.1 caps prepared meals at not more than 3 meals a day and not
      more than 80 baht per person per meal. The word in the text layer is
      ไม่เกิน (printed as ไม,เกิน). It is a ceiling. It is not a flat payment
      and it does not by itself prove that a household is eligible.
    text_th: "ค่าอาหารจัดเลี้ยง วันละไม่เกิน ๓ มื้อ มื้อละไม่เกิน ๘๐ บาทต่อคน"
    source_url: *mof_url
    source_excerpt: "๕.๑.๑ ค่าอาหารจัดเลี้ยง วันละไม,เกิน ๓ มื้อ มื้อละไม,เกิน ๘๐ บาทต่อคน"
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.1, page 1."

  - id: MOF-2569-KIT
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.2 caps a survival kit at not more than 1,000 baht per family.
      A further kit of not more than 1,000 baht per person may be considered
      for a child not over 7 years, a person with a disability, and an older
      person, and only when that person is in the database of the Ministry of
      Social Development and Human Security. The first 1,000 is Thai digits
      ๑ ๐ ๐ ๐ with broken spacing. The second 1,000 is printed as ๑,๐๐๐.
      Being a child, a disabled person, or an older person is not enough if
      the database condition is not met. The cap is not a flat payment.
    text_th: >
      ค่าถุงยังชีพ ชุดละไม่เกิน ๑,๐๐๐ บาทต่อครอบครัว และสำหรับเด็กอายุไม่เกิน ๗ ปี
      คนพิการ และผู้สูงอายุ ซึ่งอยู่ในระบบฐานข้อมูลของกระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์
      ชุดละไม่เกิน ๑,๐๐๐ บาทต่อคน
    source_url: *mof_url
    source_excerpt: >
      ๕.๑.๒ ค่าถุงยังชีพ ชุดละไม่เกิน ๑ ,๐ ๐ ๐ บาท ต่อครอบครัว และในกรณีที่ผู้ประสบภัยพิบัติเป็นเด็กอายุไม,เกิน ๗ ปี คนพิการ และผู้สูงอายุ ซึ่งเป็นกลุ่มที่อยู่ในระบบฐานข้อมูล ชองกระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์ ให้พิจารณาช่วยเหลือค่าถุงยังชีพเพิ่มเติมได้อีก ชุดละไม,เกิน ๑,๐๐๐ บาทต่อคน
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.2, page 1. The particle before the ministry name extracted as ชอง."
    caveat: >
      The ministry name การพัฒนาสังคมและความมั่นคงของมนุษย์ is fully printed.
      The particle glyph immediately before กระทรวง is damaged.

  - id: MOF-2569-WATER-ACTUAL
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility]
    text_en: >
      Clause 5.1.3 allows the actual cost of buying or arranging water for
      drinking and household use, as necessary, until the disaster situation
      returns to normal. This clause prints no baht cap. Do not invent one.
    text_th: >
      ค่าจัดซื้อหรือจัดหาน้ำสำหรับบริโภคและใช้สอยในที่อยู่อาศัย เท่าที่จ่ายจริงตามความจำเป็นจนกว่าเหตุการณ์จะเข้าสู่ภาวะปกติ
    source_url: *mof_url
    source_excerpt: >
      ๕.๑.๓ ค่าจัดซื้อหรือจัดหานํ้าสำหรับบริโภคและใช้สอยในที่อยู่อาศัย เท่าที่จ่ายจริง ตามความจำเป็นจนกว่าเหตุการณ์ประสบภัยพิบัติจะเข้าสู่ภาวะปกติ
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.3, page 1."

  - id: MOF-2569-LIVING-TOTAL
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.4 caps initial living costs, where the dwelling is damaged
      in its entirety, at actual cost not more than 4,900 baht per family.
      It is a ceiling for that case. It is not a flat grant and it does not
      apply, on this clause's own words, to partial damage.
    text_th: >
      ค่าใช้จ่ายในการดำรงชีพเบื้องต้น กรณีที่อยู่อาศัยได้รับความเสียหายทั้งหลัง เท่าที่จ่ายจริงครอบครัวละไม่เกิน ๔,๙๐๐ บาท
    source_url: *mof_url
    source_excerpt: >
      ๕.๑.๔ ค่าใช้จ่ายในการดำรงชีพเบื้องด้น กรณีที่อยู่อาศัยได้รับความเสียหายทั้งหลัง เท่าที่จ่ายจริงครอบครัวละไม่เกิน ๔,๙๐๐ บาท
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.4, page 1."

  - id: MOF-2569-HOUSE-REPAIR
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.5 caps repair of the permanent everyday dwelling at actual
      cost not more than 88,600 baht per house. The same sentence says this
      does not include a rented house. A claim for a rented house under this
      clause is outside the clause. The figure is a ceiling, not a flat grant.
    text_th: >
      ค่าซ่อมแซมที่อยู่อาศัยประจำ เท่าที่จ่ายจริงหลังละไม่เกิน ๘๘,๖๐๐ บาท ทั้งนี้ไม่รวมถึงบ้านเช่า
    source_url: *mof_url
    source_excerpt: >
      ๕.๑.๕ ค่าซ่อมแซมที่อยู่อาศัยประจำ เท่าที่จ่ายจริงหลังละไม,เกิน ๘๘,๖๐๐ บาท ทั้งนี้ ไม,รวมถึงบ้านเช่า
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.5, page 1."

  - id: MOF-2569-FARM-BUILDING
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.6 caps repair of a rice barn, a crop store, and an animal
      pen at actual cost not more than 6,800 baht per family. The figure is
      a ceiling, not a flat grant.
    text_th: >
      ค่าซ่อมแซมยุ้งข้าว โรงเรือนสำหรับเก็บพืชผล และคอกสัตว์ เท่าที่จ่ายจริงครอบครัวละไม่เกิน ๖,๘๐๐ บาท
    source_url: *mof_url
    source_excerpt: >
      ๕.๑.๖ ค่าซ่อมแซมยุ้งข้าว โรงเรือนสำหรับเก็บพืชผล และคอกสัตว์ที่ได้รับความเสียหาย เท่าที่จ่ายจริงครอบครัวละไม,เกิน ๖,๘๐๐ บาท
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.6, page 1."

  - id: MOF-2569-RENT
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      Clause 5.1.7 applies when the victim rents someone else's house and
      that rented house is wholly damaged, or partly damaged so that it
      cannot be lived in. Assistance is the actual rent, not more than 2,500
      baht per family per month, for not more than 2 months. A habitable
      rented house is outside this clause. The figure is a ceiling.
    text_th: >
      บ้านเช่าเสียหายทั้งหลังหรือเสียหายบางส่วนจนอยู่อาศัยไม่ได้ ให้ช่วยเหลือค่าเช่าเท่าที่จ่ายจริงครอบครัวละไม่เกินเดือนละ ๒,๕๐๐ บาท เป็นเวลาไม่เกิน ๒ เดือน
    source_url: *mof_url
    source_excerpt: >
      ๕.๑.๗ กรณีที่ผู้ประสบภัยพิบัติเช่าบ้านเรือนของผู้อื่น และบ้านเช่าเสียหายจากภัยพิบัติทั้งหลังหรือเสียหายบางส่วนจนอยู่อาศัยไม,ได้ ให้ช่วยเหลือเป็นค่าเช่าบ้านแก่ผู้ประสบภัยพิบัติ เท่าที่จ่ายจริงในอัตราครอบครัวละไม่เกินเดือนละ ๒,๕๐๐ บาท เป็นเวลาไม่เกิน ๒ เดือน
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.7, page 1."

  - id: MOF-2569-TARP
    status: verified
    topic: aid_eligibility
    checks: [aid_eligibility, denial]
    text_en: >
      The second limb of clause 5.1.8 caps canvas, plastic sheet, or other
      material for sun and rain at actual cost not more than 1,200 baht per
      family. The figure is a ceiling. The conversion-of-premises cap in the
      same clause is a separate unverified rule because its digits are not stable.
    text_th: >
      ค่าผ้าใบหรือผ้าพลาสติกหรือวัสดุอื่น ๆ สำหรับกันแดดกันฝน เท่าที่จ่ายจริงครอบครัวละไม่เกิน ๑,๒๐๐ บาท
    source_url: *mof_url
    source_excerpt: >
      หรือค่าผ้าใบหรือผ้าพลาสติกหรือวัสดุอื่น ๆ สำหรับกันแดดกันฝน เท่าที่จ่ายจริงครอบครัวละไม่เกิน ๑,๒๐๐ บาท
    retrieved: *mof_date
    license_note: *mof_license
    locator: "Clause 5.1.8, second limb, page 2."

