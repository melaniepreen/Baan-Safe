# Harness setting, not a product decision. The live chooser is
# gateway.route_chooser in config/decisions.yaml and stays the field precheck.
#
# exclusive: one turn calls System 1 or System 2, never both.
# cascade:   the chooser still picks one entry point. When it picks System 1
#            and System 1 escalates, the same turn continues to System 2 with
#            the System 1 outcome as the handoff (decided 24 Oct 2026).
#            The no-stub fallback outcome (missing_evidence ["fixture_stub"])
#            never cascades.
# The stub harness, only when the case id is a fixture, uses that fixture's
# expected.system. That lookup is a test convenience. It is not a routing rule.
mode: cascade
