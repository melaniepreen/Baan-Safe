# JUDGEMENT CALLS — human sign-off required. Listed in MORNING_REPORT.md.
# Operational ingest choices. These are not the TODO_HUMAN product decisions
# in decisions.yaml.

# api.open-meteo.com and archive-api.open-meteo.com publish robots.txt as
# "User-agent: * / Disallow: /". Open-Meteo's own API docs invite these calls.
# The client calls only the documented forecast and archive endpoints, at or
# below 1 request/second, and does not crawl the website.
# Set to false to skip Open-Meteo entirely.
open_meteo_documented_api_despite_robots_disallow: true

overpass:
  # overpass-api.de robots.txt disallows /api/, so that host is not used.
  # This host has no robots.txt (HTTP 404), which means no crawl restrictions.
  interpreter: https://overpass.openstreetmap.fr/api/interpreter

# Weather rows are one per location per day (Open-Meteo daily variables),
# not raw hourly samples.
weather_granularity: daily

# A flood polygon is assigned to the nearest admin_level=6 centre inside this
# distance. This is not a polygon-intersection against a district boundary set.
# HDX district boundaries are listed as later — human to approve.
district_match_km: 25

# Overpass is queried per flood cluster, not once for the whole country.
# The public risk layer (fixture districts) is kept, then observed-event
# clusters (EOS-RS, GDACS, UNOSAT) and any live GISTDA window that still
# fits in the box. A cluster wider than max_bbox_degrees is skipped.
max_overpass_clusters: 4
max_bbox_degrees: 4

# GISTDA feature API. Caps stop a national download (7-day and 30-day
# matches are tens or hundreds of thousands of polygons; repeat-flood is
# millions). The key is read from GISTDA_API_KEY / .env and is never stored.
gistda:
  page_limit: 100
  max_extent_features_per_window: 800
  max_repeat_features: 400
  # Lampang, Phrae, Nan, Phayao (fixtures), Chiang Mai, Lamphun, Chiang Rai
  # (2024 UNOSAT scenes), Songkhla (Hat Yai).
  province_codes: [50, 51, 52, 54, 55, 56, 57, 90]

# UNOSAT shapefiles are fetched only when the HDX licence is an open
# Creative Commons licence and the shapefile is under this size.
# Larger open products are listed in data/SOURCES.md and not downloaded.
unosat_max_shp_bytes: 20000000

# A GDACS or satellite polygon wider than this is kept out of flood_extent.
# A country-sized ring would mark half of Thailand as flooded.
max_stored_span_degrees: 4

# ThaiWater gauge rain is attached to a district only inside this radius.
thaiwater_match_km: 25
