# Every value starts as TODO_HUMAN. Code reading these must fail loudly if unset.
# Humans fill these in. Do not resolve them in code.
# scripts/validate.py allowlists only the decisions a human has already made:
# system2.use_banyan_sapling, system2.sapling_scope, sapling.client,
# system2.hosting, llm.provider_route, gateway.route_chooser,
# system1.extraction_method, system2.orchestrator_model,
# system2.max_latency_ms, correction_loop.graduation_threshold,
# correction_loop.escalation_threshold, data.demo_event, memory.*,
# modal.finetune_base_model, and modal.finetune_gpu.
system1:
  extraction_method: rules-only      # decided: keyword rules in system1/extract.py; extraction_model stays TODO_HUMAN
  extraction_model: TODO_HUMAN       # only if a model is used
system2:
  orchestrator_model: nvidia/nemotron-3-nano-30b-a3b  # decided 24 Oct 2026: Mubit compat id, paid tier (the free tier shares a 50/day cap)
  hosting: openrouter via mubit gateway  # decided: Nemotron via OpenRouter; Mubit stays the hop
  use_banyan_sapling: true           # decided: verifier on, for sapling_scope only
  sapling_scope: aid_eligibility,denial
  max_latency_ms: 10000
sapling:
  hosting: TODO_HUMAN                # mubit gateway or self-hosted; Mubit stays the hop; unconfirmed that Mubit can route to a self-hosted endpoint
  gpu: TODO_HUMAN                    # L40S on Modal, or A6000 self-hosted; 48GB class
  thai_handling: TODO_HUMAN          # translate to English first, or send Thai; the card's evaluated language is English
  model_id: TODO_HUMAN               # published checkpoint is MubitLabs/banyan-sapling; unset so the Modal app refuses
  client: stub                       # stub | live. stub does not load a GPU
gateway:
  route_chooser: field precheck      # decided: gateway/chooser.py reads config/escalation.yaml triggers
  auth: TODO_HUMAN                   # auth scheme in front of the Mubit gateway
memory:
  mubit_project: baansafe-demo       # decided: control-plane run_id / project scope; override with MUBIT_PROJECT_ID for a console proj-…
  retrieval_top_k: 5                 # decided: max evidence rows from /v2/control/query
  token_budget: 400                  # decided: max_token_budget hint on the query payload
llm:
  provider_route: mubit              # decided: OpenAI SDK via https://api.mubit.ai/compat/openrouter/v1
  token_price_usd: TODO_HUMAN        # do not invent a price; cost stays null until this is set
speech_to_text:
  provider: TODO_HUMAN               # or "scripted only" for the demo
ui:
  framework: TODO_HUMAN
data:
  demo_event: Sukhumvit / Watthana (Bangkok)  # decided: match town basemap + flood.json; GISTDA Hat Yai enrich is off-script unless a call names Songkhla
  production_db: TODO_HUMAN          # committed JSON in data/processed tonight
correction_loop:
  graduation_threshold: 2            # decided: matching S2 decisions before a pattern graduates to a System 1 rule (RL loop, eval/rl/); P1 and complex patterns become recommendations instead
  escalation_threshold: 2            # decided: distinct human-corrected cases before a pattern escalates to System 2 as complex_situation (gateway/graduation.py; never into System 1)
learning_eval:
  promotion: TODO_HUMAN              # do not promote a version from eval/learning
  freeze_mubit_auto_adapters: TODO_HUMAN  # freeze auto-adapters before a live eval run
latte_bench:
  license_confirmation: TODO_HUMAN   # MubitLabs/latte-bench has no license; confirm with Mubit before any use beyond reference
# Caller simulator. The scripted backend is the default and does not load weights.
# A model backend must go through llm/client.py. A MIMESIS-style 9B is one option.
# Weights and license are unconfirmed. Do not fill these in from the paper.
sim:
  caller_model: TODO_HUMAN
  caller_gpu: TODO_HUMAN
# Which corpus rule ids the demo may treat as authoritative. The files under
# policies/ still load by id. A human chooses the set. Do not fill this in code.
policies:
  authoritative_set: TODO_HUMAN
# Modal hosting. These do not replace system1.* or system2.*.
# Apps read the environment variable first and refuse while the value is TODO_HUMAN.
# Leave this block as TODO_HUMAN in git except finetune_gpu and finetune_base_model.
# scripts/validate.py rejects any other value here.
# Set the matching environment variable at deploy time. See infra/HARDWARE.md.
modal:
  s1_gpu: TODO_HUMAN                 # cpu | T4 | L4
  s1_model_id: TODO_HUMAN            # mDeBERTa XNLI id, or convaiinnovations/laya-multilingual
  s2_gpu: TODO_HUMAN                 # T4 | L4 | A10 | L40S | A100-40GB | A100-80GB | H100 | H200
  s2_model_id: TODO_HUMAN            # Nemotron checkpoint id
  nemotron_size: TODO_HUMAN          # 4B | 8B | 9B | 30B-A3B | 49B | 70B | 120B-A12B
  s2_quant: TODO_HUMAN               # bf16 | fp8 | awq
  finetune_gpu: T4                   # decided: cheapest Modal GPU; the 4B bf16 base fits 16 GB per infra/HARDWARE.md
  finetune_base_model: nvidia/Llama-3.1-Nemotron-Nano-4B-v1.1  # decided: LoRA base, same family as System 2; SetFit for S1 still reads FINETUNE_S1_MODEL
  stt_gpu: TODO_HUMAN                # cpu | T4 | L4
  stt_model_id: TODO_HUMAN           # Whisper or a Thai fine-tune id
