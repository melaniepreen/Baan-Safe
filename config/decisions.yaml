  nemotron_size: TODO_HUMAN          # 4B | 8B | 9B | 30B-A3B | 49B | 70B | 120B-A12B
  s2_quant: TODO_HUMAN               # bf16 | fp8 | awq
  finetune_gpu: TODO_HUMAN           # cpu | T4 | L4 | A10 | L40S | A100-40GB | A100-80GB | H100 | H200
