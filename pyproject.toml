[project]
name = "baansafe"
version = "0.1.0"
description = "BaanSafe Phase 0 contracts and Phase 1 stubbed service"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyshp>=2.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
