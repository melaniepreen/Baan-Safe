services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: baansafe-api:local
    ports:
      - "8000:8000"
    environment:
      S1_IMPL: stub
      S2_IMPL: stub
      MEMORY_IMPL: mock
      ENRICH_IMPL: data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
